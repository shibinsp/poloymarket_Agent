[project]
name = "moneyai-analyst"
version = "0.1.0"
description = "Restrict-only market analyst sidecar for the MoneyAI NSE intraday engine (shadow mode)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "feedparser>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
# Live market data (India VIX, Nifty, daily OHLCV) via Yahoo Finance.
data = ["yfinance>=0.2.50"]
# Research-only forecasting models (never published to the trading context).
ml = ["scikit-learn>=1.5", "lightgbm>=4.3"]
dev = ["pytest>=8"]

[project.scripts]
moneyai-analyst = "moneyai_analyst.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneyai_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
