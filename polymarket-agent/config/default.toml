[agent]
mode = "paper"                    # paper | live | backtest
cycle_interval_seconds = 60       # 1 minute (reduced from 600s to eliminate latency)
death_balance_threshold = 0.0
low_fuel_threshold = 2.0
api_reserve = 2.0
initial_paper_balance = 100.0
daily_api_budget = 0.50           # max API spend per UTC day ($); see [risk] below
max_sleep_seconds = 3600          # longest sleep while every venue is closed

[scanning]
max_markets = 1000
min_volume_24h = 1500.0
max_resolution_days = 14
max_spread_pct = 0.03              # a wider book costs more than any edge we can price
categories = ["weather", "sports", "crypto", "politics"]

[valuation]
# provider = "anthropic" (default) | "openai_compatible"
#
# For any OpenAI-compatible endpoint (NVIDIA NIM, vLLM, OpenRouter, Together)
# set provider + base_url + model, and put the key in LLM_API_KEY. Example:
#   provider = "openai_compatible"
#   base_url = "https://integrate.api.nvidia.com/v1"
#   model = "meta/llama-3.3-70b-instruct"
# Pricing defaults to $0 for openai_compatible — set input/output prices below
# if your endpoint bills you, otherwise the daily budget cap and the
# edge-justifies-cost gate will both treat calls as free.
provider = "openai_compatible"
base_url = "https://integrate.api.nvidia.com/v1"
model = "meta/llama-3.2-11b-vision-instruct"
max_tokens = 4096
# input_price_per_million = 3.00
# output_price_per_million = 15.00
# Edge must clear spread, fees and model error. 1-2% hurdles were below the
# cost of crossing a typical Polymarket book, so they selected losing trades.
min_edge_threshold = 0.05
high_confidence_edge = 0.04
low_confidence_edge = 0.08
cache_ttl_seconds = 300

[risk]
kelly_fraction = 0.20                 # fractional Kelly: model probabilities are not well calibrated
max_position_pct = 0.10              # no single position above 10% of bankroll
max_total_exposure_pct = 0.50        # at most half the bankroll at risk at once
max_positions_per_category = 3
min_position_usd = 1.0
india_capital_allocation_inr = 25000.0     # INR: ₹1,000 isolated paper/sandbox allocation
us_capital_allocation_usd = 1000.0       # USD: $1,000.00 initial capital for US equities (Alpaca paper)
us_max_position_pct = 0.20               # At most $200 of the $1,000 US allocation in one stock
us_max_exposure_pct = 0.50               # At most $500 total US stock exposure
us_cash_buffer_pct = 0.10                 # Keep 10% of available US stock cash uncommitted
us_risk_per_trade_pct = 0.01              # Target at most 1% of available capital at the ATR stop
us_max_daily_loss_usd = 20.0              # Tightest cash loss limit; pauses all entries for the day
us_max_trades_per_day = 3
us_max_quote_age_seconds = 120


# --- Circuit breakers -------------------------------------------------------
#
# Every limit below bounds a *sequence*, which nothing else here does: Kelly
# sizes one position, the exposure cap bounds the book, the stop bounds one
# loss. Twenty trades each losing their stop is twenty correctly-sized losses
# and a ruined account.
#
# Tripping stops new entries only. Exits, order polling, reconciliation and
# settlement all keep running — refusing to close a position because the day
# went badly is how a bounded loss becomes an unbounded one.
#
# Losses trip on a strict `>` and counts on a `>=`, so 0 means "none
# tolerated" rather than "disabled". To switch a check off, set it high.
#
# Clear a halt with `POST /api/halt` ... `/api/resume`, or by deleting the
# HALT file in the data directory.

# Lost more than this fraction of the day's opening equity -> stop entries for
# the rest of the UTC day. Lifts by itself at midnight.
max_daily_loss_pct = 0.05
# The same limit in cash. Sized to the capital actually traded ($100 bankroll +
# $1,000 US allocation), not the $100k Alpaca paper balance; LIVE: 5.0
max_daily_loss_usd = 50.0
# Below the all-time equity high by more than this -> stop until a human
# resumes. Does not lift at midnight: sleeping on a drawdown changes nothing.
max_drawdown_pct = 0.15
# Positions opened per UTC day, and losing closes in a row. Both rest-of-day.
max_trades_per_day = 20
max_consecutive_losses = 4
# Absolute ceilings, applied only in live mode. A percentage of a paper
# balance is a number nobody agreed to, and the first live run must not
# inherit it: 6% of a $100,000 paper account is a $6,000 position.
max_live_notional_per_position_usd = 10.0
max_live_total_notional_usd = 60.0

[execution]
order_type = "limit"
order_ttl_seconds = 300
max_slippage_pct = 0.002
max_retries = 3

[monitoring]
log_level = "info"
discord_enabled = false
daily_summary_hour = 9
dashboard_port = 8088
dashboard_bind = "127.0.0.1"          # set DASHBOARD_TOKEN in the env before binding anywhere else

[polymarket]
clob_base_url = "https://clob.polymarket.com"
gamma_base_url = "https://gamma-api.polymarket.com"
chain_id = 137

[rate_limit]
requests_per_second = 10
burst_size = 20
backoff_base_ms = 1000
backoff_max_ms = 30000

[database]
path = "polymarket-agent.db"
# Where the HALT file and the hourly snapshots live. Defaults to the database
# file's own directory. Snapshots are kept 48-hourly and 30-daily.
# data_dir = "/var/lib/polymarket-agent"

# Trading venues. Leave empty to keep the legacy Polymarket-only loop.
# Continuous assets (crypto, equities) need an explicit symbol universe —
# unlike prediction markets they are not discovered.
#
[[venues]]
id = "alpaca"
kind = "alpaca"
enabled = true
base_url = "https://paper-api.alpaca.markets"
data_url = "https://data.alpaca.markets"
# Liquid large caps and index ETFs only: low-priced names (SIRI, NOK, LCID,
# PLUG, NIO, SOFI) whipsaw a daily crossover and carry wider spreads.
# The swing strategy trades only [us_strategy].symbols; the rest are the
# opening-range breakout universe ([us_orb]).
symbols = [
    "SPY", "QQQ", "IWM", "DIA", "AAPL", "MSFT", "NVDA", "AMZN", "META", "GOOGL", "TSLA", "AVGO",
    "AMD", "NFLX", "ORCL", "CRM", "ADBE", "INTC", "MU", "QCOM", "TXN", "AMAT", "LRCX", "KLAC",
    "MRVL", "SMCI", "ARM", "PLTR", "COIN", "MSTR", "HOOD", "SHOP", "UBER", "ABNB", "SNOW", "CRWD",
    "PANW", "NOW", "DDOG", "NET", "ZS", "MDB", "JPM", "BAC", "WFC", "GS", "MS", "C",
    "SCHW", "V", "MA", "PYPL", "XYZ", "UNH", "LLY", "JNJ", "PFE", "MRK", "ABBV", "XOM",
    "CVX", "OXY", "WMT", "COST", "HD", "NKE", "SBUX", "MCD", "DIS", "KO", "PEP", "BA",
    "CAT", "GE", "DE", "SOFI", "RIVN", "LCID", "NIO", "F", "GM", "AAL", "CCL", "MARA",
    "RIOT", "DELL", "HPQ", "CSCO", "IBM", "T", "VZ",
]
fee_pct = 0.0025
#
# Coinbase Advanced Trade — spot crypto, 24/7.
#
# Credentials are COINBASE_API_KEY_NAME (organizations/{org}/apiKeys/{key})
# and COINBASE_API_PRIVATE_KEY (the EC PEM issued with it).
#
# WARNING: Coinbase has no paper endpoint. Its sandbox serves auth and
# serialization only — there is no matching engine — so an enabled Coinbase
# venue reaches the LIVE exchange and trades real money. The agent therefore
# refuses to build it unless agent.mode = "live", and says so at startup.
#
# fee_pct is the TAKER rate at the lowest volume tier (<$1K/30d), which is
# where micro capital starts. Orders go out as limit GTC without post_only, so
# they can take — and round_trip_cost doubles this number, so quoting the maker
# rate here would clear the edge threshold on trades that are really negative
# after fees. Lower it when your volume tier earns it.
#
# [[venues]]
# id = "coinbase"
# kind = "coinbase"
# enabled = false
# symbols = ["BTC/USD", "ETH/USD"]
# fee_pct = 0.012
#
# Binance.US — spot crypto, 24/7.
#
# Credentials are BINANCE_US_API_KEY and BINANCE_US_SECRET_KEY.
#
# WARNING: Binance.US has no testnet. `testnet.binance.vision` belongs to
# GLOBAL Binance, which is a different exchange with a different symbol list
# and one that blocks US persons — so there is nothing to point paper mode at.
# The agent refuses to build this venue unless agent.mode = "live".
#
# Quote currency matters: BTC/USD and BTC/USDT are different pairs holding
# cash in different assets, and the adapter reads its cash currency from the
# symbols configured here.
#
# fee_pct is the TAKER rate at the base volume tier. Verify it against your
# own tier and Binance.US's current schedule before trading real money —
# round_trip_cost doubles this number, so understating it clears the edge
# threshold on trades that are negative after fees.
#
# [[venues]]
# id = "binance_us"
# kind = "binance_us"
# enabled = false
# symbols = ["BTC/USD", "ETH/USD"]
# fee_pct = 0.006

# Upstox Sandbox (NSE Cash Equities).
# SAFETY: Strictly isolated from real-money live order execution.
# Allows testing against official Upstox API v2 Sandbox endpoints or in-memory mock engine.
[[venues]]
id = "upstox_sandbox"
kind = "upstox_sandbox"
# Off: the NSE paper book is run by the [india_strategy] worker alone. Enabled,
# the generic venue cycle also traded it (bought BHARTIARTL on 2026-10-30 while
# the momentum strategy was in cash). The worker uses the Upstox feed directly.
enabled = false
symbols = ["ITC", "TATAMOTORS", "HDFCBANK", "SBIN", "RELIANCE", "INFY", "ICICIBANK", "TCS", "BHARTIARTL", "LT", "HINDUNILVR"]
fee_pct = 0.001

[sizing_continuous]
risk_per_trade_pct = 0.02           # lose at most 2% of bankroll if the stop is hit
atr_period = 14
atr_multiplier = 1.5            # stop distance = ATR x this, then clamped
min_stop_pct = 0.01             # 1.0% min stop
max_stop_pct = 0.03             # 3.0% max stop
min_p_up = 0.51                 # minimum probability-of-up before a view is tradeable
max_orders_per_cycle = 2        # cap on new positions opened per cycle

[exits_continuous]
take_profit_pct = 0.015          # 2.0% realistic take-profit target
max_hold_hours = 24             # 24 hours max hold

[us_strategy]
# Selectable US equity strategy: "sma_crossover" | "momentum_pullback"
strategy = "sma_crossover"
fast_sma_period = 20
slow_sma_period = 50
moving_average_type = "SMA"   # Explicitly Simple Moving Average (SMA), not EMA
symbols = [
    "SPY", "QQQ", "AAPL", "MSFT", "NVDA", "AMZN", "META", "GOOGL", "TSLA",
]
# Golden-cross confirmations (0 disables each). A cross is only an entry when
# ADX(14) >= min_adx and regime_symbol closes above its regime_sma_period-day
# SMA. Over 5 years (examples/us_sma_compare.rs) these cut drawdown at the same
# profit factor; a signal-day volume filter (min_volume_ratio = 1.2) removed
# three quarters of trades and turned the profit factor to 0.99, so it is off.
min_volume_ratio = 0.0
min_adx = 20.0
regime_symbol = "SPY"
regime_sma_period = 200
# Stop management: after +breakeven_at_r R the stop moves to entry, then trails
# trail_atr_multiplier x ATR(14) below the highest high since entry.
breakeven_at_r = 1.0
trail_atr_multiplier = 3.0

[us_orb]
# "Stocks in play" opening-range breakout, intraday, long and short, paper only.
# The 9:30 five-minute bar is the range; a stock qualifies when that bar's volume
# is >= rvol_min x its 14-session average. Enter on the first 5-minute close
# beyond the range, stop at the other side, flat 15 minutes before the close.
# Backtest (91 symbols, Nov 2024 - Oct 2026, equal $ sizing, 5 bp slippage):
# +6.3% in the first year and +21.3% in the second, which was held out.
# Live uses Alpaca's free IEX feed (the backtest used SIP), so ranges differ a little.
enabled = true
rvol_min = 2.5
position_pct = 0.20          # equal dollars per trade: $200 of the $1,000 U.S. allocation
max_trades_per_day = 3       # shared with the U.S. daily entry limit
daily_loss_pct = 0.02        # no new ORB entries after a 2% day loss
allow_short = true           # whole shares only: shorts above ~$200 a share will not size
max_entry_slippage_pct = 0.002
symbols = [
    "SPY", "QQQ", "IWM", "DIA", "AAPL", "MSFT", "NVDA", "AMZN", "META", "GOOGL", "TSLA", "AVGO",
    "AMD", "NFLX", "ORCL", "CRM", "ADBE", "INTC", "MU", "QCOM", "TXN", "AMAT", "LRCX", "KLAC",
    "MRVL", "SMCI", "ARM", "PLTR", "COIN", "MSTR", "HOOD", "SHOP", "UBER", "ABNB", "SNOW", "CRWD",
    "PANW", "NOW", "DDOG", "NET", "ZS", "MDB", "JPM", "BAC", "WFC", "GS", "MS", "C",
    "SCHW", "V", "MA", "PYPL", "XYZ", "UNH", "LLY", "JNJ", "PFE", "MRK", "ABBV", "XOM",
    "CVX", "OXY", "WMT", "COST", "HD", "NKE", "SBUX", "MCD", "DIS", "KO", "PEP", "BA",
    "CAT", "GE", "DE", "SOFI", "RIVN", "LCID", "NIO", "F", "GM", "AAL", "CCL", "MARA",
    "RIOT", "DELL", "HPQ", "CSCO", "IBM", "T", "VZ",
]

[india_strategy]
# "momentum": monthly rotation into the 4 strongest watchlist stocks by
#   9-month return, only while NIFTY 50 closes above its 200-day SMA (else cash).
#   Beat NIFTY on 2023-2026 data the selection never saw.
# "pullback": the original 5-minute VWAP pullback. It lost 15-32% over
#   May-Oct 2026 in replay, before and after costs; kept only for comparison.
strategy = "momentum"

[telemetry]
# OpenTelemetry span export. Off unless an endpoint is set here or via
# OTEL_EXPORTER_OTLP_ENDPOINT / LANGFUSE_HOST in the environment.
#
# Point it at a self-hosted Langfuse or any OTLP collector; "/v1/traces" is
# appended if absent. Langfuse renders the valuation spans as generations,
# with model, token counts and cost, because they carry GenAI
# semantic-convention attributes.
#
#   otlp_endpoint = "http://localhost:3000/api/public/otel"   # self-hosted Langfuse
#   otlp_endpoint = "http://localhost:4318"                   # plain collector
#
# `enabled` is left unset on purpose, not written as `false`.
#
# Unset means "no opinion": setting OTEL_EXPORTER_OTLP_ENDPOINT or
# LANGFUSE_HOST in the environment then turns export on, which is the
# one-variable path. Writing `enabled = false` here is a different and
# stronger statement — it means "off, whatever the environment says" — and it
# is the right thing to write on a host where a platform injects OTLP
# variables for every process and you do not want this one exporting.
#
#   enabled = true     # on, even with no env var (needs otlp_endpoint below)
#   enabled = false    # off, even if the environment sets an endpoint
service_name = "polymarket-agent"
# Whether prompts and completions travel with the span. Leave on for a
# destination you control; turn it off and the spans keep model, token
# counts, cost and latency but carry no text.
#
# It only takes effect when export is actually configured: with no exporter
# there is no span for the text to ride on, and prompts are never written to
# the ordinary logs regardless of this setting.
export_content = true
export_timeout_seconds = 10
